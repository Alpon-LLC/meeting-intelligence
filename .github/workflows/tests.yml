name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_public_port.py -v
      - run: python -m unittest discover -s skills/meeting-auto-join/tests -v
      - run: python -m unittest discover -s skills/meeting-finalize/tests -v
